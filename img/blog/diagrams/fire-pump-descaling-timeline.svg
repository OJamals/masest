<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Fire-pump descaling case timeline</title>
  <desc id="desc">Five stages from a pump that would not start through solenoid cleaning, cavity descaling, and restored flow and pressure.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10263f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4c6f95"/>
    </marker>
  </defs>
  <rect width="1440" height="500" rx="28" fill="#f4f8fb"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#10263f">From no start to proper flow and pressure</text>
  <text x="48" y="91" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52677c">Walmart distribution center fire-pump maintenance record</text>

  <path d="M155 147H1280" stroke="#a9bbcc" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(36 118)" filter="url(#shadow)">
      <rect width="250" height="218" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#e95f4e"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="24" y="92" font-size="23" font-weight="700" fill="#10263f">Pump will not start</text>
      <text x="24" y="128" font-size="17" fill="#52677c">Maintenance check finds</text>
      <text x="24" y="153" font-size="17" fill="#52677c">rust and calcite on</text>
      <text x="24" y="178" font-size="17" fill="#52677c">the solenoid switch.</text>
    </g>

    <g transform="translate(314 118)" filter="url(#shadow)">
      <rect width="250" height="218" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2d78aa"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="24" y="92" font-size="23" font-weight="700" fill="#10263f">Solenoid cleaned</text>
      <text x="24" y="128" font-size="17" fill="#52677c">Descaler works for</text>
      <text x="24" y="153" font-size="17" fill="#52677c">30 minutes. Part is</text>
      <text x="24" y="178" font-size="17" fill="#52677c">wiped and reinstalled.</text>
    </g>

    <g transform="translate(592 118)" filter="url(#shadow)">
      <rect width="250" height="218" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#d6922d"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="24" y="92" font-size="23" font-weight="700" fill="#10263f">Pump starts</text>
      <text x="24" y="128" font-size="17" fill="#52677c">Low water flow and</text>
      <text x="24" y="153" font-size="17" fill="#52677c">pressure point to more</text>
      <text x="24" y="178" font-size="17" fill="#52677c">scale inside the cavity.</text>
    </g>

    <g transform="translate(870 118)" filter="url(#shadow)">
      <rect width="250" height="218" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#7257a8"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="24" y="92" font-size="23" font-weight="700" fill="#10263f">Cavity descaled</text>
      <text x="24" y="128" font-size="17" fill="#52677c">A 24-hour soak loosens</text>
      <text x="24" y="153" font-size="17" fill="#52677c">the deposit before rinse</text>
      <text x="24" y="178" font-size="17" fill="#52677c">and reassembly.</text>
    </g>

    <g transform="translate(1148 118)" filter="url(#shadow)">
      <rect width="250" height="218" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2b8a69"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
      <text x="24" y="92" font-size="23" font-weight="700" fill="#10263f">Target restored</text>
      <text x="24" y="128" font-size="17" fill="#52677c">A 30-minute test</text>
      <text x="24" y="153" font-size="17" fill="#52677c">confirms proper flow</text>
      <text x="24" y="178" font-size="17" fill="#52677c">and pressure.</text>
    </g>
  </g>

  <rect x="48" y="386" width="1344" height="70" rx="18" fill="#10263f"/>
  <text x="720" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#fff">Clean the restriction, verify the numbers, then add descaling to planned maintenance.</text>
</svg>
