<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage drone building-cleaning plan</title>
  <desc id="desc">Map the surface, test from the ground, set the flight plan, apply and rinse, then compare the finished exterior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b24"/>
      <stop offset="1" stop-color="#17404a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5be0d5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Plan the chemistry and the flight together.</text>
  <text x="64" y="120" fill="#bed0d3" font-family="Arial, sans-serif" font-size="20">The drone solves access. The cleaning plan solves the surface.</text>

  <path d="M145 320H1050" fill="none" stroke="#5be0d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(145 320)">
      <circle r="66" fill="#fff"/>
      <path d="M-30 31v-55h60v55M-18 31V4h15v27M10-11h10M10 5h10" fill="none" stroke="#087c7b" stroke-width="8" stroke-linejoin="round"/>
      <text y="108" fill="#fff" font-size="21" font-weight="700">1. Map</text>
      <text y="138" fill="#bed0d3" font-size="16">Surface + soil</text>
    </g>
    <g transform="translate(370 320)">
      <circle r="66" fill="#5be0d5"/>
      <path d="M-35 26h70M-27 8h54M0-37c15 19 24 32 24 45a24 24 0 01-48 0c0-13 9-26 24-45z" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round"/>
      <text y="108" fill="#fff" font-size="21" font-weight="700">2. Ground test</text>
      <text y="138" fill="#bed0d3" font-size="16">Mix + dwell + finish</text>
    </g>
    <g transform="translate(595 320)">
      <circle r="66" fill="#fff"/>
      <path d="M-34-7h68M-18-24l18 17 18-17M0-7v31M-23 24h46M-42-18h16M26-18h16" fill="none" stroke="#087c7b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="108" fill="#fff" font-size="21" font-weight="700">3. Flight plan</text>
      <text y="138" fill="#bed0d3" font-size="16">People + wind + path</text>
    </g>
    <g transform="translate(820 320)">
      <circle r="66" fill="#5be0d5"/>
      <path d="M-38-22h76M-25-35l25 13 25-13M0-22v18M-31 16l13 13M0 10v19M31 16L18 29" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="108" fill="#fff" font-size="21" font-weight="700">4. Apply + rinse</text>
      <text y="138" fill="#bed0d3" font-size="16">Coverage + control</text>
    </g>
    <g transform="translate(1045 320)">
      <circle r="66" fill="#fff"/>
      <path d="M-33 0l21 21 45-48M-32 37h64" fill="none" stroke="#087c7b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="108" fill="#fff" font-size="21" font-weight="700">5. Compare</text>
      <text y="138" fill="#bed0d3" font-size="16">Finish + time + water</text>
    </g>
  </g>

  <rect x="64" y="520" width="1072" height="100" rx="20" fill="#fff" fill-opacity=".08" stroke="#5be0d5" stroke-opacity=".4" stroke-width="2"/>
  <text x="92" y="560" fill="#5be0d5" font-family="Arial, sans-serif" font-size="18" font-weight="700">BUILD THE ROUTE AROUND THE REAL BUILDING</text>
  <text x="92" y="594" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Access, chemistry, coverage, runoff, finish, and return-to-service time.</text>
</svg>
