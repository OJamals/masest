<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">VertKleen LAM3 spray-and-walk-away plan</title>
  <desc id="desc">Five steps from checking the surface and mixing for light or heavy staining through low-pressure application, dwell, and scheduled maintenance.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10263f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6b8798"/>
    </marker>
  </defs>
  <rect width="1440" height="560" rx="28" fill="#f3f8f4"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#10263f">Plan the LAM3 spray-and-walk-away job</text>
  <text x="48" y="91" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52677c">Lichen, algae, moss, mold, and mildew stains • pH neutral • HMIS 0-0-0</text>

  <path d="M150 151H1285" stroke="#abc1b2" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(36 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#405f73"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Check the surface</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Identify the stain and</text>
      <text x="24" y="156" font-size="17" fill="#52677c">test a small area before</text>
      <text x="24" y="182" font-size="17" fill="#52677c">the full application.</text>
    </g>

    <g transform="translate(314 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2d78aa"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Mix for the stain</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Heavy staining: 1:5</text>
      <text x="24" y="156" font-size="17" fill="#52677c">Light staining: 1:10</text>
      <text x="24" y="182" font-size="17" fill="#52677c">Use fresh water.</text>
    </g>

    <g transform="translate(592 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2b8a69"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Apply low pressure</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Spray or brush the mix</text>
      <text x="24" y="156" font-size="17" fill="#52677c">across the stain. Keep</text>
      <text x="24" y="182" font-size="17" fill="#52677c">coverage even.</text>
    </g>

    <g transform="translate(870 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#6a8f43"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Let time work</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Walk away. Maximum</text>
      <text x="24" y="156" font-size="17" fill="#52677c">spray-and-leave results</text>
      <text x="24" y="182" font-size="17" fill="#52677c">may take up to a month.</text>
    </g>

    <g transform="translate(1148 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#d6922d"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Maintain the result</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Reapply when staining</text>
      <text x="24" y="156" font-size="17" fill="#52677c">returns or every six</text>
      <text x="24" y="182" font-size="17" fill="#52677c">months as needed.</text>
    </g>
  </g>

  <rect x="48" y="410" width="1344" height="102" rx="20" fill="#10263f"/>
  <text x="720" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#83d6ae">HEAVY AREAS</text>
  <text x="720" y="487" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">Brush, rinse, then reapply if needed. No acid, caustic, solvent, bleach, or quat.</text>
</svg>
