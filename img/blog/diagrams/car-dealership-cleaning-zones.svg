<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Five-zone car dealership cleaning plan</title>
  <desc id="desc">Map the dealership, reset vehicles, degrease the service bay, clean customer areas, then inspect before opening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c25"/>
      <stop offset="1" stop-color="#173740"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5be0d5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">One dealership. Five clean handoffs.</text>
  <text x="64" y="120" fill="#bed0d3" font-family="Arial, sans-serif" font-size="20">Reset customer-facing and working areas without mixing every job together.</text>
  <path d="M150 320H1040" fill="none" stroke="#5be0d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 320)">
      <circle r="70" fill="#fff"/>
      <path d="M-31-28h62v56h-62zM-18-10h36M-18 5h24" fill="none" stroke="#087c7b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">1. Map</text>
      <text y="143" fill="#bed0d3" font-size="17">Set zones and finish</text>
    </g>
    <g transform="translate(375 320)">
      <circle r="70" fill="#5be0d5"/>
      <path d="M-39 12h78l-8-28h-62zM-27 12v18M27 12v18" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">2. Vehicles</text>
      <text y="143" fill="#bed0d3" font-size="17">Torque + AlumiBrite</text>
    </g>
    <g transform="translate(600 320)">
      <circle r="70" fill="#fff"/>
      <path d="M-38 24h76M-28 24V-18h56v42M-14-18v-18h28v18" fill="none" stroke="#087c7b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">3. Service bay</text>
      <text y="143" fill="#bed0d3" font-size="17">CRHD on working soil</text>
    </g>
    <g transform="translate(825 320)">
      <circle r="70" fill="#5be0d5"/>
      <path d="M-34 22h68M-27 22V-18h54v40M-14-18v-18h28v18" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">4. Customer areas</text>
      <text y="143" fill="#bed0d3" font-size="17">MultiWash + Purgo</text>
    </g>
    <g transform="translate(1050 320)">
      <circle r="70" fill="#fff"/>
      <path d="M-35 2l22 22 48-52" fill="none" stroke="#087c7b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">5. Inspect</text>
      <text y="143" fill="#bed0d3" font-size="17">Open sales-ready</text>
    </g>
  </g>
  <rect x="64" y="528" width="1072" height="90" rx="20" fill="#fff" fill-opacity=".08" stroke="#5be0d5" stroke-opacity=".4" stroke-width="2"/>
  <text x="92" y="565" fill="#5be0d5" font-family="Arial, sans-serif" font-size="18" font-weight="700">MEASURE THE FULL RESET</text>
  <text x="92" y="597" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Chemicals + labor + passes + time until sales and service lanes are ready.</text>
</svg>
