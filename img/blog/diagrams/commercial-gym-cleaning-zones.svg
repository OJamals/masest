<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial gym cleaning plan split into four practical stages</title>
  <desc id="desc">Remove visible soil, clean member-facing equipment with Purgo, clean wet and hard-surface zones with MultiWash, then inspect and log the work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c25"/>
      <stop offset="1" stop-color="#173740"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5be0d5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Split the building. Simplify the close.</text>
  <text x="64" y="120" fill="#bed0d3" font-family="Arial, sans-serif" font-size="20">Give each gym zone the cleaner and routine its surfaces need.</text>
  <path d="M174 320H1020" fill="none" stroke="#5be0d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(170 320)">
      <circle r="72" fill="#fff"/>
      <path d="M-34 20h68M-24-20h48M-16-34h32" fill="none" stroke="#087c7b" stroke-width="9" stroke-linecap="round"/>
      <text y="116" fill="#fff" font-size="23" font-weight="700">1. Pre-clean</text>
      <text y="148" fill="#bed0d3" font-size="17">Lift sweat and soil</text>
    </g>
    <g transform="translate(455 320)">
      <circle r="72" fill="#5be0d5"/>
      <path d="M-40-15h80M-32-15v48M32-15v48M-42 33h84" fill="none" stroke="#10242d" stroke-width="9" stroke-linecap="round"/>
      <text y="116" fill="#fff" font-size="23" font-weight="700">2. Workout floor</text>
      <text y="148" fill="#bed0d3" font-size="17">Purgo: equipment + mats</text>
    </g>
    <g transform="translate(745 320)">
      <circle r="72" fill="#fff"/>
      <path d="M-34 22h68M-24 4h48M0-39c-18 21-28 36-28 49a28 28 0 0056 0C28-3 18-18 0-39z" fill="none" stroke="#087c7b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="116" fill="#fff" font-size="23" font-weight="700">3. Wet zones</text>
      <text y="148" fill="#bed0d3" font-size="17">MultiWash: tile + glass</text>
    </g>
    <g transform="translate(1030 320)">
      <circle r="72" fill="#5be0d5"/>
      <path d="M-35 2l22 22 48-52" fill="none" stroke="#10242d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="116" fill="#fff" font-size="23" font-weight="700">4. Inspect</text>
      <text y="148" fill="#bed0d3" font-size="17">Log misses and reopen</text>
    </g>
  </g>
  <rect x="64" y="528" width="1072" height="90" rx="20" fill="#fff" fill-opacity=".08" stroke="#5be0d5" stroke-opacity=".4" stroke-width="2"/>
  <text x="92" y="565" fill="#5be0d5" font-family="Arial, sans-serif" font-size="18" font-weight="700">ONE PROGRAM, TWO CLEANING ZONES</text>
  <text x="92" y="597" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Member-facing equipment stays ready. Wet areas stop dragging down the whole facility.</text>
</svg>
