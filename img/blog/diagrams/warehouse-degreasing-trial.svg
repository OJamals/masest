<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Warehouse degreaser trial workflow</title>
  <desc id="desc">Four steps: segment the task, set the method, run matched areas, and record completed-task cost.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f8f8"/>
  <text x="72" y="96" fill="#142326" font-family="Arial,sans-serif" font-size="44" font-weight="700">Prove the switch one task at a time.</text>
  <text x="72" y="137" fill="#52676a" font-family="Arial,sans-serif" font-size="22">Same soil. Same area. Same endpoint. Full operating cost.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(72 190)">
      <rect width="238" height="310" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Segment</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28">Floor, fleet, parts,</tspan><tspan x="28" dy="31">kitchen, or glass.</tspan><tspan x="28" dy="31">Do not blend tasks.</tspan></text>
    </g>
    <g transform="translate(344 190)">
      <rect width="238" height="310" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Set method</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28">Record dilution,</tspan><tspan x="28" dy="31">contact, agitation,</tspan><tspan x="28" dy="31">rinse, and recovery.</tspan></text>
    </g>
    <g transform="translate(616 190)">
      <rect width="238" height="310" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Run matched</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28">Hold soil load, area,</tspan><tspan x="28" dy="31">tools, crew, and clean</tspan><tspan x="28" dy="31">endpoint constant.</tspan></text>
    </g>
    <g transform="translate(888 190)">
      <rect width="238" height="310" rx="20" fill="#0b3438"/>
      <circle cx="56" cy="58" r="30" fill="#67d6dd"/><text x="56" y="69" text-anchor="middle" fill="#0b3438" font-size="30" font-weight="700">4</text>
      <text x="28" y="132" fill="#fff" font-size="28" font-weight="700">Count all</text>
      <text x="28" y="178" fill="#c8e7e9" font-size="21"><tspan x="28">Product, passes, labor,</tspan><tspan x="28" dy="31">water, downtime, and</tspan><tspan x="28" dy="31">rework per task.</tspan></text>
    </g>
  </g>
  <path d="M176 558H1022" stroke="#0e7c86" stroke-width="7" stroke-linecap="round"/>
  <path d="M1022 558l-24-17v34z" fill="#0e7c86"/>
</svg>
