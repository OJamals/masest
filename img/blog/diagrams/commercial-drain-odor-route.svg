<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Commercial drain odor control route</title>
  <desc id="desc">Five steps for finding a recurring commercial drain odor, clearing basic mechanical causes, cleaning residue, applying Purgo, and tracking the maintenance interval.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10263f" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6a8b87"/>
    </marker>
  </defs>
  <rect width="1440" height="560" rx="28" fill="#f2f8f7"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#10263f">Find the drain odor before treating it</text>
  <text x="48" y="91" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52677c">Traps • grease • organic film • stagnant water • HMIS 0-0-0</text>

  <path d="M150 151H1285" stroke="#a9c7c1" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(36 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#405f73"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Find the drain</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Smell, inspect, and mark</text>
      <text x="24" y="156" font-size="17" fill="#52677c">the exact drain where</text>
      <text x="24" y="182" font-size="17" fill="#52677c">the odor returns.</text>
    </g>

    <g transform="translate(314 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2d78aa"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Rule out basics</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Restore trap water.</text>
      <text x="24" y="156" font-size="17" fill="#52677c">Check flow, venting,</text>
      <text x="24" y="182" font-size="17" fill="#52677c">and visible blockage.</text>
    </g>

    <g transform="translate(592 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#2b8a69"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Clean the soil</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Remove loose organic</text>
      <text x="24" y="156" font-size="17" fill="#52677c">residue before the</text>
      <text x="24" y="182" font-size="17" fill="#52677c">treatment step.</text>
    </g>

    <g transform="translate(870 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#5a7e72"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Apply Purgo</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Non-food odor control:</text>
      <text x="24" y="156" font-size="17" fill="#52677c">1:64. Give the surface</text>
      <text x="24" y="182" font-size="17" fill="#52677c">one minute.</text>
    </g>

    <g transform="translate(1148 122)" filter="url(#shadow)">
      <rect width="250" height="244" rx="18" fill="#fff"/>
      <circle cx="42" cy="29" r="22" fill="#d6922d"/>
      <text x="42" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
      <text x="24" y="91" font-size="23" font-weight="700" fill="#10263f">Track the return</text>
      <text x="24" y="130" font-size="17" fill="#52677c">Log drain, date, odor,</text>
      <text x="24" y="156" font-size="17" fill="#52677c">and days until the</text>
      <text x="24" y="182" font-size="17" fill="#52677c">next treatment.</text>
    </g>
  </g>

  <rect x="48" y="410" width="1344" height="102" rx="20" fill="#10263f"/>
  <text x="720" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#83d6ae">SOURCE CONTROL</text>
  <text x="720" y="487" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">Purgo targets odor-causing organic residue instead of covering the smell with fragrance.</text>
</svg>
