<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop heat-exchanger descaling setup</title>
  <desc id="desc">A five-step flow from isolation and pump connection through circulation, rinse, and inspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#e7f4f3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#118c8b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#10242d" font-family="Arial, sans-serif" font-size="34" font-weight="700">One clean loop. Five clear steps.</text>
  <text x="64" y="120" fill="#4e6269" font-family="Arial, sans-serif" font-size="20">Plan the full path from shutdown to restart before the pump turns on.</text>

  <path d="M168 306H1020" fill="none" stroke="#118c8b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 306)">
      <circle r="72" fill="#10242d"/>
      <path d="M-20-24v48M20-24v48M-35 0h70" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <text y="116" fill="#10242d" font-size="24" font-weight="700">1. Isolate</text>
      <text y="148" fill="#53676e" font-size="18">Take unit offline</text>
    </g>
    <g transform="translate(375 306)">
      <circle r="72" fill="#087c7b"/>
      <path d="M-31 14h62V-8c0-18-14-32-31-32s-31 14-31 32z" fill="none" stroke="#fff" stroke-width="9"/>
      <circle r="12" fill="#fff"/>
      <text y="116" fill="#10242d" font-size="24" font-weight="700">2. Connect</text>
      <text y="148" fill="#53676e" font-size="18">Pump, hoses, reservoir</text>
    </g>
    <g transform="translate(600 306)">
      <circle r="72" fill="#10242d"/>
      <path d="M-35 10c20-44 61-40 69-4M35 6l-2-29-26 12" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="116" fill="#10242d" font-size="24" font-weight="700">3. Circulate</text>
      <text y="148" fill="#53676e" font-size="18">Let HCR reach scale</text>
    </g>
    <g transform="translate(825 306)">
      <circle r="72" fill="#087c7b"/>
      <path d="M0-37c18 24 30 40 30 57a30 30 0 01-60 0c0-17 12-33 30-57z" fill="none" stroke="#fff" stroke-width="9"/>
      <text y="116" fill="#10242d" font-size="24" font-weight="700">4. Rinse</text>
      <text y="148" fill="#53676e" font-size="18">Flush released buildup</text>
    </g>
    <g transform="translate(1050 306)">
      <circle r="72" fill="#10242d"/>
      <circle cy="-7" r="28" fill="none" stroke="#fff" stroke-width="9"/>
      <path d="M20 15l27 27" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      <text y="116" fill="#10242d" font-size="24" font-weight="700">5. Inspect</text>
      <text y="148" fill="#53676e" font-size="18">Confirm clean flow</text>
    </g>
  </g>

  <rect x="64" y="526" width="1072" height="92" rx="20" fill="#fff" stroke="#cce3e1" stroke-width="2"/>
  <text x="92" y="565" fill="#118c8b" font-family="Arial, sans-serif" font-size="18" font-weight="700">THE NUMBER THAT MATTERS</text>
  <text x="92" y="597" fill="#10242d" font-family="Arial, sans-serif" font-size="24" font-weight="700">Total time from isolation to a clean, working heat exchanger.</text>
</svg>
