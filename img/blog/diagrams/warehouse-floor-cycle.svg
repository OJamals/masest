<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Five-step warehouse floor degreasing cycle</title>
  <desc id="desc">Sweep, spot treat, scrub, recover, and inspect one warehouse cleaning lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c25"/>
      <stop offset="1" stop-color="#173740"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5be0d5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="64" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Clean one lane. Learn the whole job.</text>
  <text x="64" y="120" fill="#bed0d3" font-family="Arial, sans-serif" font-size="20">Keep the same floor, machine, operator, and finish target.</text>

  <path d="M156 320H1040" fill="none" stroke="#5be0d5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 320)">
      <circle r="70" fill="#fff"/>
      <path d="M-28 24h56M-12-30l24 54M-28-23l16-7" fill="none" stroke="#087c7b" stroke-width="9" stroke-linecap="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">1. Sweep</text>
      <text y="143" fill="#bed0d3" font-size="17">Remove loose debris</text>
    </g>
    <g transform="translate(375 320)">
      <circle r="70" fill="#5be0d5"/>
      <path d="M-7-34h14v30M-20 25h40M0-4c-14 13-23 24-23 37h46C23 20 14 9 0-4z" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">2. Spot treat</text>
      <text y="143" fill="#bed0d3" font-size="17">Work the heavy soil</text>
    </g>
    <g transform="translate(600 320)">
      <circle r="70" fill="#fff"/>
      <rect x="-37" y="-17" width="74" height="43" rx="12" fill="none" stroke="#087c7b" stroke-width="8"/>
      <circle cx="-22" cy="31" r="10" fill="#087c7b"/>
      <circle cx="22" cy="31" r="10" fill="#087c7b"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">3. Scrub</text>
      <text y="143" fill="#bed0d3" font-size="17">Match pad and dilution</text>
    </g>
    <g transform="translate(825 320)">
      <circle r="70" fill="#5be0d5"/>
      <path d="M-37 26h74M-25 8h50M0-38c15 20 24 33 24 47a24 24 0 01-48 0c0-14 9-27 24-47z" fill="none" stroke="#10242d" stroke-width="8" stroke-linecap="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">4. Recover</text>
      <text y="143" fill="#bed0d3" font-size="17">Lift dirty solution</text>
    </g>
    <g transform="translate(1050 320)">
      <circle r="70" fill="#fff"/>
      <path d="M-34 1l22 22 47-51" fill="none" stroke="#087c7b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="112" fill="#fff" font-size="23" font-weight="700">5. Inspect</text>
      <text y="143" fill="#bed0d3" font-size="17">Count passes and time</text>
    </g>
  </g>

  <rect x="64" y="528" width="1072" height="90" rx="20" fill="#fff" fill-opacity=".08" stroke="#5be0d5" stroke-opacity=".4" stroke-width="2"/>
  <text x="92" y="565" fill="#5be0d5" font-family="Arial, sans-serif" font-size="18" font-weight="700">COMPARE THE FINISHED LANE</text>
  <text x="92" y="597" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Product + passes + water + labor + time until traffic returns.</text>
</svg>
