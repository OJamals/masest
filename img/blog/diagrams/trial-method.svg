<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A fair industrial cleaner test</title>
  <desc id="desc">Choose one job, keep the comparison fair, count the whole job, and turn the winner into a repeatable routine.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f8f8"/>
  <text x="72" y="96" fill="#142326" font-family="Arial,sans-serif" font-size="44" font-weight="700">Test it on one real job.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(72 170)">
      <rect width="238" height="330" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Choose the job</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28" dy="0">Pick one mess, one</tspan><tspan x="28" dy="31">surface, and one</tspan><tspan x="28" dy="31">cleaning goal.</tspan></text>
    </g>
    <g transform="translate(344 170)">
      <rect width="238" height="330" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Keep it fair</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28" dy="0">Use the same mess,</tspan><tspan x="28" dy="31">area, tools, and</tspan><tspan x="28" dy="31">target finish.</tspan></text>
    </g>
    <g transform="translate(616 170)">
      <rect width="238" height="330" rx="20" fill="#fff" stroke="#b9d7d9" stroke-width="3"/>
      <circle cx="56" cy="58" r="30" fill="#0e7c86"/><text x="56" y="69" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text>
      <text x="28" y="132" fill="#142326" font-size="28" font-weight="700">Count the job</text>
      <text x="28" y="178" fill="#52676a" font-size="21"><tspan x="28" dy="0">Compare the finish,</tspan><tspan x="28" dy="31">labor, water, and</tspan><tspan x="28" dy="31">downtime.</tspan></text>
    </g>
    <g transform="translate(888 170)">
      <rect width="238" height="330" rx="20" fill="#0b3438"/>
      <circle cx="56" cy="58" r="30" fill="#67d6dd"/><text x="56" y="69" text-anchor="middle" fill="#0b3438" font-size="30" font-weight="700">4</text>
      <text x="28" y="132" fill="#fff" font-size="28" font-weight="700">Make it routine</text>
      <text x="28" y="178" fill="#c8e7e9" font-size="21"><tspan x="28" dy="0">Write down the mix,</tspan><tspan x="28" dy="31">steps, rinse, and</tspan><tspan x="28" dy="31">ready-to-use check.</tspan></text>
    </g>
  </g>
  <path d="M176 555H1022" stroke="#0e7c86" stroke-width="7" stroke-linecap="round"/>
  <path d="M1022 555l-24-17v34z" fill="#0e7c86"/>
</svg>
