<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
  <title>Cart | MASEST</title>
  <meta name="description" content="Review your VertKleen cart and continue to secure checkout.">
  <meta name="theme-color" content="#fafbfc">
  <link rel="icon" type="image/png" href="img/favicon-enhanced.png?v=20260617c">
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="css/style.css?v=20260710f">
<link rel="stylesheet" href="css/navigation.css?v=20260706a">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/config.js" defer></script>
  <script src="js/track.js" defer></script>
  <script type="module" src="js/main.js?v=20260711e"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<noscript>
  <nav class="nojs-nav" aria-label="Site">
    <a href="index.html"><b>MASEST</b></a>
    <a href="products.html">Products</a>
  <a href="services.html">Services</a>
    <span>Use Cases</span>
    <a href="industries.html">Industries</a>
    <a href="proof.html">Proof</a>
    <a href="resources.html">Resources</a>
  </nav>
</noscript>
<main id="main">
  <section class="section">
    <div class="container cart-shell">
      <div class="cart-panel">
        <div class="section-head">
          <p class="eyebrow">Order lines</p>
          <h1>Your cart</h1>
        </div>
        <div id="cartLines" class="cart-lines" aria-live="polite"></div>
      </div>

      <aside class="cart-summary" aria-labelledby="orderSummaryTitle" hidden>
        <div class="cart-summary-head">
          <p class="eyebrow">Checkout</p>
          <h2 id="orderSummaryTitle">Order summary</h2>
        </div>
        <p id="cartStatus" class="cart-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        <div id="checkoutActive">
          <div id="cartEstimate" class="cart-estimate" hidden aria-live="polite"></div>
          <form id="checkoutForm" novalidate>
            <label class="field-label" for="checkoutEmail">Receipt email</label>
            <input id="checkoutEmail" class="cart-input" type="email" autocomplete="email" inputmode="email" aria-describedby="checkoutEmailHelp" placeholder="buyer@company.com">
            <p id="checkoutEmailHelp" class="cart-field-help">Optional. Order confirmation is sent to this address.</p>
            <div class="cart-actions">
              <button class="btn btn-primary" id="checkoutPay" type="submit">Proceed to checkout</button>
              <button class="btn btn-secondary" id="checkoutNet" type="button" hidden>Place order with NET terms</button>
            </div>
          </form>
          <p class="cart-checkout-note"><i class="ph ph-lock-key" aria-hidden="true"></i> Secure Card / ACH checkout. Freight is confirmed separately before fulfillment.</p>
          <p class="cart-quote-prompt">Need a formal quote? <a id="checkoutQuote" href="contact.html?type=quote">Request a quote</a></p>
          <div id="cartAccount" class="cart-account" hidden></div>
        </div>
      </aside>
    </div>
  </section>
</main>
<script type="module">
  import { checkout, clear, items, remove, setQty } from "./js/cart.js";
  import { me, getToken } from "./js/auth.js";

  const priceMoney = (n, currency = "USD") => new Intl.NumberFormat("en-US", {
    style: "currency", currency: String(currency || "USD").toUpperCase(), minimumFractionDigits: 2, maximumFractionDigits: 2
  }).format(Number(n));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // vsku -> { name, price, currency }, flattened from /api/products variants.
  const vmap = new Map();
  let catalogReady = false;
  const fallbackNames = {
    crhd: "VertKleen CR HD",
    hcr: "VertKleen HCR",
  };
  function isLocalStaticPreview() {
    return /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname) && !window.MASEST_ENABLE_LOCAL_API;
  }
  async function loadCatalog() {
  if (isLocalStaticPreview()) return;
  try {
    const token = await getToken().catch(() => null);
    const r = await fetch("/api/products", token ? { headers: { Authorization: `Bearer ${token}` } } : undefined);
    if (!r.ok) return;
      const data = await r.json();
      (data.products || []).forEach(p => {
        const parent = p.products && typeof p.products === "object" ? p.products : p;
        if (p.vsku) {
          const productName = parent.name || p.name || p.sku;
          const label = p.label || "Each";
          vmap.set(p.vsku, {
            name: `${productName} - ${label}`,
            price: p.price == null ? null : Number(p.price),
            currency: p.currency || parent.currency || "usd",
            purchasable: parent.active !== false && (parent.mode || p.mode) === "buy" && p.active !== false && p.price != null,
          });
          return;
        }

        const variants = Array.isArray(p.product_variants) ? p.product_variants : [];
        if (!variants.length) {
          vmap.set(p.sku, {
            name: p.name,
            price: p.price == null ? null : Number(p.price),
            currency: p.currency || "usd",
            purchasable: p.active !== false && p.mode === "buy" && p.price != null,
          });
          return;
        }
        variants.forEach(v => {
          if (!v || !v.vsku) return;
          vmap.set(v.vsku, {
            name: `${p.name} - ${v.label}`,
            price: v.price == null ? null : Number(v.price),
            currency: v.currency || p.currency || "usd",
            purchasable: p.active !== false && p.mode === "buy" && v.active !== false && v.price != null,
          });
        });
      });
    } catch (err) { /* offline: fall back to raw SKUs */ }
  }

  const lines = document.getElementById("cartLines");
  const estimate = document.getElementById("cartEstimate");
  const status = document.getElementById("cartStatus");
  const email = document.getElementById("checkoutEmail");
  const checkoutPay = document.getElementById("checkoutPay");
  const checkoutNet = document.getElementById("checkoutNet");
  const checkoutQuote = document.getElementById("checkoutQuote");
  const checkoutForm = document.getElementById("checkoutForm");
  const summary = document.querySelector(".cart-summary");
  const shell = document.querySelector(".cart-shell");
  const checkoutLabels = {
    pay: checkoutPay.textContent,
    net: checkoutNet.textContent,
  };

  // NET terms require an approved business account. Returns null if the user is
  // logged out or the auth client/CDN is unavailable.
  async function getAuthToken() {
    try {
      return (await getToken()) || null;
    } catch (err) {
      return null;
    }
  }

  function setCheckoutDisabled(disabled) {
    checkoutPay.disabled = disabled;
    checkoutNet.disabled = disabled;
  }

  function setCheckoutPending(mode, pending) {
    const button = mode === "net" ? checkoutNet : checkoutPay;
    button.textContent = pending
      ? mode === "net" ? "Checking account terms..." : "Starting checkout..."
      : checkoutLabels[mode];
    if (pending) button.setAttribute("aria-busy", "true");
    else button.removeAttribute("aria-busy");
  }

  function checkoutErrorMessage(err) {
    if (err?.code === "not_purchasable") {
      return err.message || "Some SKUs need bulk freight review. Send a quote request and MASEST will confirm availability.";
    }
    if (err?.code === "auth_required_for_net") {
      return "NET terms require an approved business account. Send a quote request and MASEST will confirm account terms.";
    }
    if (err?.code === "net_terms_unavailable") {
      return "NET terms are not available for this account yet. Send a quote request for approval and terms review.";
    }
    if (err?.code === "stripe_not_configured") {
      return "Online checkout is not configured yet. Send a quote request and MASEST will complete the order path.";
    }
    if (err?.code === "credit_limit_exceeded") {
      const avail = Number(err.available || 0).toFixed(2);
      const total = Number(err.order_total || 0).toFixed(2);
      return `This $${total} order exceeds your available credit ($${avail}). Pay now with a card, or send a quote request and MASEST will review your account terms.`;
    }
    if (err?.code === "out_of_stock") {
      return err.message || "Some items do not have enough stock. Adjust quantities or request a quote.";
    }
    if (err?.code === "mixed_currency") {
      return err.message || "Items in your cart use different currencies. Order them separately.";
    }
    if (err?.code === "stripe_error" || err?.code === "server_error") {
      return "Checkout hit a temporary error. Try again in a moment, or send a quote request and MASEST will complete the order.";
    }
    if (err?.message === "cart_empty") return "Add at least one product before checkout.";
    // Server error messages are written for buyers — prefer them over the generic fallback.
    if (err?.message && err.message !== err.code) return err.message;
    return "Checkout is not available for this cart. Send a quote request and MASEST will confirm the order path.";
  }

  function productName(sku) {
    const fallback = fallbackNames[String(sku).toLowerCase()];
    const name = vmap.get(sku)?.name || fallback || sku;
    return fallback && name === "VertKleen CRHD" ? fallback : name;
  }

  function quoteUrl(cartItems) {
    const params = new URLSearchParams({ type: "quote" });
    const receiptEmail = email?.value?.trim();
    if (receiptEmail) params.set("email", receiptEmail);
    if (cartItems.length) {
      params.set("message", `Cart quote request: ${cartItems.map((item) => `${productName(item.sku)} x ${item.qty}`).join("; ")}.`);
    }
    return `contact.html?${params.toString()}`;
  }

  function syncQuoteHref() {
    if (checkoutQuote) checkoutQuote.href = quoteUrl(items());
  }

  function checkoutReady() {
    const cartItems = items();
    return cartItems.length > 0 && !cartItems.some(item => {
      const meta = vmap.get(item.sku);
      return meta && !meta.purchasable;
    });
  }

  function render() {
    const cartItems = items();
    syncQuoteHref();
    const hasBlockedLine = cartItems.some(item => {
      const meta = vmap.get(item.sku);
      return meta && !meta.purchasable;
    });
    setCheckoutDisabled(cartItems.length === 0 || hasBlockedLine);
    if (hasBlockedLine) {
      status.dataset.state = "err";
      status.textContent = "Remove bulk freight items before checkout, or send a quote request.";
      status.hidden = false;
    } else if (status.dataset.state === "err" && cartItems.length) {
      status.dataset.state = "";
      status.textContent = "";
      status.hidden = true;
    }
    const hasSuccess = status.dataset.state === "ok" && Boolean(status.textContent);
    // Empty carts keep only the short continuation message. Successful NET
    // orders keep their confirmation visible after the cart is cleared.
    const checkoutActive = document.getElementById("checkoutActive");
    const summaryHidden = !cartItems.length && !hasSuccess;
    if (summary) summary.hidden = summaryHidden;
    if (shell) shell.classList.toggle("is-empty", summaryHidden);
    if (checkoutActive) checkoutActive.hidden = !cartItems.length;
    if (status && !cartItems.length) status.hidden = !hasSuccess;
    if (!cartItems.length) {
      lines.innerHTML = hasSuccess
        ? `<div class="cart-empty"><h2>Order submitted.</h2><p>Your cart is clear. Follow fulfillment and invoice updates from your account.</p><a class="btn btn-primary" href="dashboard.html#orders">View your orders</a></div>`
        : `<div class="cart-empty"><h2>No products in the cart.</h2><p>Use the product catalog to add purchase-ready SKUs, or send a quote request for volume pricing.</p><a class="btn btn-primary" href="products.html">Browse products</a></div>`;
      updateSubtotal();
      return;
    }
    if (!catalogReady) {
      if (summary) summary.hidden = true;
      if (shell) shell.classList.add("is-empty");
      lines.setAttribute("aria-busy", "true");
      lines.innerHTML = `<div class="cart-empty"><h2>Loading cart details…</h2><p>Confirming current product names and pricing.</p></div>`;
      return;
    }
    lines.removeAttribute("aria-busy");
    lines.innerHTML = cartItems.map(item => {
      const meta = vmap.get(item.sku);
      const name = productName(item.sku);
      const detail = meta?.purchasable
        ? `${priceMoney(meta.price, meta.currency)} each`
        : meta
          ? "Quote required"
          : "Price confirmed at checkout";
      const safeSku = esc(item.sku);
      const safeName = esc(name);
      const safeDetail = esc(detail);
      return `
      <article class="cart-line">
        <div>
          <span class="eyebrow">${safeSku}</span>
          <h2>${safeName}</h2>
          <p>${safeDetail}</p>
        </div>
        <label>
          <span>Qty</span>
          <input type="number" min="1" step="1" value="${item.qty}" data-qty="${safeSku}" aria-label="Quantity for ${safeName}">
        </label>
        <button type="button" class="btn btn-ghost" data-remove="${safeSku}" aria-label="Remove ${safeName} from cart">Remove</button>
      </article>
    `;
    }).join("");
    updateSubtotal();
  }

  function updateSubtotal() {
    if (!estimate) return;
    const cartItems = items();
    let subtotal = 0;
    let pricedLines = 0;
    let itemCount = 0;
    const currencies = new Set();
    cartItems.forEach(item => {
      itemCount += item.qty;
      const meta = vmap.get(item.sku);
      if (!meta?.purchasable || meta.price == null || !Number.isFinite(Number(meta.price))) return;
      subtotal += Number(meta.price) * item.qty;
      pricedLines += 1;
      currencies.add(String(meta.currency || "usd").toUpperCase());
    });
    estimate.hidden = !cartItems.length;
    if (!cartItems.length) return;
    const canEstimate = pricedLines === cartItems.length && currencies.size === 1;
    const subtotalText = canEstimate
      ? priceMoney(subtotal, [...currencies][0])
      : "Pending review";
    const itemLabel = `${itemCount} ${itemCount === 1 ? "item" : "items"}`;
    estimate.innerHTML = `
      <dl>
        <div><dt>Shipping</dt><dd>Confirmed separately</dd></div>
        <div><dt>Tax</dt><dd>Calculated at checkout</dd></div>
        <div class="cart-total-row"><dt>Estimated subtotal <span class="cart-total-count">${itemLabel}</span></dt><dd>${subtotalText}</dd></div>
      </dl>
      <p>Final product pricing and discounts are confirmed at checkout.</p>
    `;
  }

  // A cleared qty field mid-edit is not a removal — only commit values >= 1 and
  // let the Remove button be the sole deletion path. render() on change restores
  // the stored qty when the field is left empty/invalid.
  const validQty = (value) => { const n = Number(value); return Number.isFinite(n) && n >= 1; };
  lines.addEventListener("change", event => {
    const sku = event.target?.dataset?.qty;
    if (!sku) return;
    if (validQty(event.target.value)) setQty(sku, event.target.value);
    render();
  });
  lines.addEventListener("input", event => {
    const sku = event.target?.dataset?.qty;
    if (!sku) return;
    if (!validQty(event.target.value)) return;
    setQty(sku, event.target.value);
    syncQuoteHref();
    updateSubtotal();
  });
  lines.addEventListener("click", event => {
    const sku = event.target?.dataset?.remove;
    if (!sku) return;
    remove(sku);
    render();
  });

  async function runCheckout(mode) {
    if (!items().length) {
      status.dataset.state = "err";
      status.textContent = "Add at least one product before checkout.";
      status.hidden = false;
      setCheckoutDisabled(true);
      return;
    }
    const receiptEmail = email.value.trim();
    if (receiptEmail && !email.checkValidity()) {
      status.dataset.state = "err";
      status.textContent = "Enter a valid receipt email, or leave the field blank.";
      status.hidden = false;
      email.focus();
      email.reportValidity();
      return;
    }
    setCheckoutDisabled(true);
    setCheckoutPending(mode, true);
    status.dataset.state = "";
    status.textContent = mode === "net" ? "Checking account terms..." : "Starting checkout...";
    status.hidden = false;
    let token;
    if (mode === "net") {
      token = await getAuthToken();
      if (!token) {
        status.dataset.state = "err";
        status.textContent = "Sign in to your approved business account to use NET terms, or send a quote request.";
        status.hidden = false;
        setCheckoutPending(mode, false);
        setCheckoutDisabled(!checkoutReady());
        return;
      }
    }
    try {
      const result = await checkout({ mode, email: receiptEmail, token });
      if (result.net) {
        status.dataset.state = "ok";
        status.textContent = result.message || "Order placed on account.";
        status.hidden = false;
        setCheckoutPending(mode, false);
        // NET success never reaches order-confirmed.html — close the funnel here.
        try { if (typeof window.mtrack === "function") window.mtrack("order_confirmed"); } catch (e) { /* best-effort */ }
        clear();
        render();
      }
    } catch (err) {
      status.dataset.state = "err";
      status.textContent = checkoutErrorMessage(err);
      status.hidden = false;
      setCheckoutPending(mode, false);
      setCheckoutDisabled(!checkoutReady());
    }
  }

  checkoutForm.addEventListener("submit", event => {
    event.preventDefault();
    runCheckout("pay");
  });
  checkoutNet.addEventListener("click", () => runCheckout("net"));
  email?.addEventListener("input", syncQuoteHref);
  // Account strip: guests get a sign-in/register option (returns to cart); members see their account.
  async function renderCartAccount() {
    const box = document.getElementById("cartAccount");
    if (!box) return;
    let data = null;
    try { data = await me(); } catch {}
    if (data && !data.needs_profile) {
      const approved = data.company?.status === "approved";
      const canUseNetTerms = data.can_use_net_terms === true;
      checkoutNet.hidden = !canUseNetTerms;
      const accountMessage = canUseNetTerms
        ? `NET terms available for <b>${esc(data.email)}</b>.`
        : approved
          ? `Signed in as <b>${esc(data.email)}</b>. NET terms are not enabled for this account.`
          : `Signed in as <b>${esc(data.email)}</b>. NET terms pending approval.`;
      box.innerHTML = `<i class="ph ph-user-circle" aria-hidden="true"></i> ${accountMessage}`;
      const email = document.getElementById("checkoutEmail");
      if (email && !email.value) email.value = data.email || "";
    } else {
      checkoutNet.hidden = true;
      box.innerHTML = `<i class="ph ph-user" aria-hidden="true"></i> Have an account? <a href="account.html?return=cart.html">Sign in</a> for saved details and approved NET terms.`;
    }
    box.hidden = false;
  }

  catalogReady = isLocalStaticPreview();
  render();
  if (!catalogReady) loadCatalog().finally(() => { catalogReady = true; render(); });
  renderCartAccount();
</script>
</body>
</html>
