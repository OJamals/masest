# Rebuild committed static SEO artifacts (per-page <title>/canonical/OG/JSON-LD
# blocks + sitemap.xml) from published Supabase page_meta, then commit + push so
# Cloudflare Pages redeploys.
#
# Why this exists: the CF build regenerates data/content/*.json from Supabase and
# public pages fetch that at runtime — but the crawler-facing SEO blocks baked
# into the committed HTML are produced by tools/seo-inject.mjs, which the CF build
# does NOT run. So a page_meta CMS publish needs this workflow to re-bake them.
#
# REQUIRED repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
#
# Triggers: weekly safety net + on-demand + repository_dispatch (seo-published),
# fired by the CMS publish action for page_meta entries.
name: Publish SEO + sitemap

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
  repository_dispatch:
    types: [seo-published]

concurrency:
  group: publish-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Re-bake SEO blocks + sitemap from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Refresh data/content in the working tree so seo-inject reads current
          # page_meta (NOT committed — other snapshots are git-sourced).
          node tools/build-content.mjs
          # seo-inject regenerates the committed HTML SEO blocks + product pages
          # + sitemap.xml (wholesale, without blog URLs).
          node tools/seo-inject.mjs
          # build-blog re-merges blog URLs into the freshly written sitemap and
          # keeps the blog pages current.
          node tools/build-blog.mjs

      - name: Commit + push static SEO changes if any
        run: |
          # Commit ONLY generated static outputs — never data/content (its other
          # snapshots are git-sourced and would be reverted to Supabase).
          git add '*.html' sitemap.xml 'blog/*' 2>/dev/null || true
          git reset -q -- data/content 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SEO/static changes to publish."
            exit 0
          fi
          git config user.name "masest-content-bot"
          git config user.email "bot@masest.co"
          git commit -m "content: publish SEO + sitemap updates [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
