name: Verify

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [site-content-published]
  workflow_dispatch:
    inputs:
      blog_newsletter:
        description: Email newly published blog posts after deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh production CMS snapshots
        if: github.repository == 'medicux/masest' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build:content

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify core
        run: npm run verify:core

      - name: Upload production build
        if: github.repository == 'medicux/masest' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  story_performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify story performance
        run: npm run qa:ui-critical:performance

  deploy:
    needs: [verify, story_performance]
    if: github.repository == 'medicux/masest' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: production-dist-${{ github.sha }}
          path: dist

      - name: Deploy production to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=masest-commerce --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Email newly published blog posts
        if: github.event_name == 'workflow_dispatch' && inputs.blog_newsletter
        env:
          BLOG_NEWSLETTER_SECRET: ${{ secrets.BLOG_NEWSLETTER_SECRET }}
        run: |
          if [ -z "$BLOG_NEWSLETTER_SECRET" ]; then
            echo "::error::BLOG_NEWSLETTER_SECRET is not configured."
            exit 1
          fi
          curl -fsS -X POST "https://masest.co/api/admin/blog-newsletter" \
            -H "x-blog-newsletter-secret: $BLOG_NEWSLETTER_SECRET" \
            -H "content-type: application/json" \
            -d '{"action":"sweep"}'
