name: Verify

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [site-content-published]
  workflow_dispatch:
    inputs:
      blog_newsletter:
        description: Email newly published blog posts after deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    needs: [web_vitals]
    # Fork pull requests must never execute on the persistent production runner.
    # Trusted push, dispatch, and scheduled work uses its repository-scoped label.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'masest-trusted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require supported PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          for binary in initdb pg_ctl postgres; do
            test -x "$pg_bin/$binary" || {
              echo "::error::Missing executable PostgreSQL binary: $pg_bin/$binary"
              exit 1
            }
          done
          pg_major="$("$pg_bin/postgres" --version | sed -E 's/.*PostgreSQL\) ([0-9]+).*/\1/')"
          case "$pg_major" in
            16|17|18) ;;
            *)
              echo "::error::Unsupported PostgreSQL major $pg_major; expected 16, 17, or 18"
              exit 1
              ;;
          esac
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"

      - name: Refresh production CMS snapshots
        if: github.repository == 'OJamals/masest' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:content

      - name: Install Chromium and system dependencies
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      - name: Verify core
        run: npm run verify:core

      - name: Deploy production to Cloudflare Pages
        if: github.repository == 'OJamals/masest' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=masest-commerce --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false

      - name: Email newly published blog posts
        if: github.repository == 'OJamals/masest' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.blog_newsletter
        env:
          BLOG_NEWSLETTER_SECRET: ${{ secrets.BLOG_NEWSLETTER_SECRET }}
        run: |
          if [ -z "$BLOG_NEWSLETTER_SECRET" ]; then
            echo "::error::BLOG_NEWSLETTER_SECRET is not configured."
            exit 1
          fi
          curl -fsS -X POST "https://masest.co/api/admin/blog-newsletter" \
            -H "x-blog-newsletter-secret: $BLOG_NEWSLETTER_SECRET" \
            -H "content-type: application/json" \
            -d '{"action":"sweep"}'

  web_vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify homepage Core Web Vitals
        run: npm run qa:ui-critical:performance
