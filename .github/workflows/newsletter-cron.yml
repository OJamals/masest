# Manual fallback for newsletter campaign sweeps. Production ownership is the
# every-five-minute Cloudflare marketing-email worker cron, which runs the shared
# preparation implementation directly. Keep this workflow_dispatch path for
# operator recovery only.
#
# REQUIRED repo secret: NEWSLETTER_CRON_SECRET (same value in CF Pages prod env).
name: Newsletter schedule sweep

on:
  workflow_dispatch: {}

concurrency:
  group: newsletter-cron
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep due scheduled newsletters
        env:
          NEWSLETTER_CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          if [ -z "$NEWSLETTER_CRON_SECRET" ]; then
            echo "NEWSLETTER_CRON_SECRET not set."
            exit 1
          fi
          curl -fsS -X POST "https://masest.co/api/admin/newsletters" \
            -H "x-newsletter-cron-secret: $NEWSLETTER_CRON_SECRET" \
            -H "content-type: application/json" \
            -d '{"action":"sweep_due"}'
