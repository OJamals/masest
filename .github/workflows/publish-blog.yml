# Regenerate the static blog from published Supabase blog_post entries, then
# commit + push so Cloudflare Pages redeploys.
#
# Closes the "publish -> live" gap: pressing Publish in the admin only flips a
# Supabase row to published; the public site serves committed files. This job
# regenerates data/content/blog.json (+ its manifest entry) via publish-blog-ci
# and the static pages via build-blog, then pushes any BLOG diff to main.
#
# SCOPE: blog only. It deliberately does NOT run publish-content — other content
# types (industry sectors, etc.) are git-sourced and a blanket Supabase publish
# would wrongly revert them.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                 https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service-role key (server-side only)
#
# Triggers:
#   - schedule: baseline automation (every 30 min) with no wiring needed
#   - workflow_dispatch: run on demand from the Actions tab
#   - repository_dispatch (type: content-published): optional — have the CMS
#     publish action POST to the GitHub dispatch API to go live immediately
name: Publish blog + content

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [content-published]

concurrency:
  group: publish-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate blog from Supabase + static pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Blog-only: writes data/content/blog.json + its manifest entry ONLY.
          # Other content snapshots (industry sectors, etc.) are git-sourced and
          # must NOT be reverted to Supabase by this job.
          node tools/publish-blog-ci.mjs
          node tools/build-blog.mjs

      - name: Commit + push if changed
        run: |
          BLOG_PATHS="data/content/blog.json data/content/manifest.json blog.html blog sitemap.xml"
          if [ -z "$(git status --porcelain $BLOG_PATHS)" ]; then
            echo "No blog changes to publish."
            exit 0
          fi
          git config user.name "masest-content-bot"
          git config user.email "bot@masest.co"
          git add $BLOG_PATHS
          git commit -m "content: publish blog updates [skip ci]"
          # Land on top of any concurrent pushes; retry once.
          git pull --rebase origin main || true
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
