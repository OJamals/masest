<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
  <title>Leave a Review | MASEST</title>
  <meta name="description" content="Leave a verified review for your MASEST VertKleen order using the link from your email.">
  <meta name="theme-color" content="#fafbfc">
  <link rel="icon" type="image/png" href="img/favicon-enhanced.png?v=20260617c">
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="css/style.css?v=20260708c">
<link rel="stylesheet" href="css/navigation.css?v=20260706a">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/config.js" defer></script>
  <script src="js/track.js" defer></script>
  <script type="module" src="js/main.js?v=20260711f"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<noscript>
  <nav class="nojs-nav" aria-label="Site">
    <a href="index.html"><b>MASEST</b></a>
    <a href="products.html">Products</a>
  <a href="services.html">Services</a>
    <span>Use Cases</span>
    <a href="industries.html">Industries</a>
    <a href="proof.html">Proof</a>
    <a href="resources.html">Resources</a>
  </nav>
</noscript>
<main id="main">
  <section class="page-hero compact">
    <div class="container split-hero">
      <div>
        <h1>Leave a review</h1>
        <p class="subhead" id="rvIntro">Checking your review link...</p>
      </div>
      <div class="hmis-panel">
        <span class="panel-title">Review</span>
        <form id="rvForm" hidden>
          <label class="rv-field">Rating
            <select name="rating" required>
              <option value="5">5 stars</option>
              <option value="4">4 stars</option>
              <option value="3">3 stars</option>
              <option value="2">2 stars</option>
              <option value="1">1 star</option>
            </select>
          </label>
          <label class="rv-field">Title (optional)
            <input name="title" maxlength="120" placeholder="Sum it up in a few words">
          </label>
          <label class="rv-field">Review
            <textarea name="body" maxlength="4000" rows="4" placeholder="How did it work for you?"></textarea>
          </label>
          <button type="submit" class="btn btn-primary">Submit review</button>
        </form>
        <p id="rvStatus" role="status" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container route-grid confirmation-grid">
      <a class="route-card" href="products.html">
        <i class="ph ph-flask" aria-hidden="true"></i>
        <span>Looking for another VertKleen product?</span>
        <b class="route-card-cta">Browse products <i class="ph ph-arrow-right" aria-hidden="true"></i></b>
      </a>
      <a class="route-card" href="services.html">
        <i class="ph ph-briefcase" aria-hidden="true"></i>
        <span>Need to scope another service?</span>
        <b class="route-card-cta">Browse services <i class="ph ph-arrow-right" aria-hidden="true"></i></b>
      </a>
      <a class="route-card" href="contact.html">
        <i class="ph ph-chat-circle" aria-hidden="true"></i>
        <span>Question about this order?</span>
        <b class="route-card-cta">Contact MASEST <i class="ph ph-arrow-right" aria-hidden="true"></i></b>
      </a>
    </div>
  </section>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const orderId = q.get("order");
  const sku = q.get("sku");
  const token = q.get("token");
  const email = q.get("email");
  const kind = q.get("kind") === "service" ? "service" : "product";
  const intro = document.getElementById("rvIntro");
  const status = document.getElementById("rvStatus");
  const form = document.getElementById("rvForm");

  function humanizeSku(value) {
    return String(value || "").replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  if (!orderId || !sku || !token || !email) {
    intro.textContent = "This review link is invalid or missing information.";
    status.textContent = "Open the review link from your email again, or contact MASEST for help.";
    return;
  }

  intro.textContent = `Reviewing ${humanizeSku(sku)}. Your purchase is already verified through this link.`;
  form.hidden = false;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    status.textContent = "Submitting...";
    try {
      const res = await fetch("/api/reviews", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          order_id: orderId, sku, kind, token, email,
          rating: form.rating.value, title: form.title.value, body: form.body.value,
        }),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw out;
      form.hidden = true;
      status.textContent = "Thanks - your review is pending approval.";
    } catch (err) {
      const code = err && err.error;
      status.textContent = code === "already_reviewed"
        ? "You have already reviewed this item."
        : code === "rate_limited"
          ? "Too many submissions - try again in a few minutes."
          : "This review link is invalid or has expired.";
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
